<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Müraciət detalları · ADDA Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fafaf6;
  --surface:#ffffff;
  --surface-2:#f4f1ea;
  --ink:#0c1a2b;
  --ink-soft:#3a4a5e;
  --muted:#6b7785;
  --border:#e6e1d6;
  --border-strong:#d3cdbf;
  --primary:#003b6f;
  --primary-700:#002a52;
  --primary-50:#eaf1f9;
  --accent:#b88746;
  --accent-soft:#e9d9bf;
  --success:#0e7c4a;
  --success-soft:#d1fadf;
  --warn:#b54708;
  --warn-soft:#fef0c7;
  --danger:#b42318;
  --danger-soft:#fee4e2;
  --info:#0e639a;
  --info-soft:#d1e9ff;
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(12,26,43,.04),0 1px 3px rgba(12,26,43,.06);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  font-family:'Manrope',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* ============= HEADER ============= */
.top-bar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:50;
}
.top-bar__left{display:flex;align-items:center;gap:16px}
.back-link{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--ink-soft);
  font-size:13px;font-weight:500;
  transition:.15s;
}
.back-link:hover{background:var(--border);text-decoration:none}
.back-link svg{width:14px;height:14px}

.top-title{display:flex;align-items:baseline;gap:12px}
.top-title h1{
  font-family:'Fraunces',serif;font-weight:600;font-size:22px;
  margin:0;letter-spacing:-.01em;
}
.top-title .reg-no{color:var(--muted);font-size:14px;font-weight:500}

.top-bar__right{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:var(--radius-sm);
  font-weight:600;font-size:13px;
  border:1px solid var(--border-strong);background:var(--surface);
  transition:.15s;
  font-family:inherit;
}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-700)}
.btn svg{width:14px;height:14px}

/* ============= LAYOUT ============= */
.wrap{
  max-width:1280px;margin:0 auto;
  padding:24px;
  display:grid;grid-template-columns:1fr 360px;gap:24px;
}
@media (max-width:980px){.wrap{grid-template-columns:1fr}}

.col-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.col-side{display:flex;flex-direction:column;gap:20px}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.card__head{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.card__head h2{
  font-family:'Fraunces',serif;font-weight:600;font-size:17px;
  margin:0;
}
.card__head p{font-size:13px;color:var(--muted);margin:0}
.card__body{padding:20px}

/* ============= INFO LIST ============= */
.info-list{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.info-item{display:flex;flex-direction:column;gap:2px;min-width:0}
.info-item dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.info-item dd{margin:0;font-weight:500;font-size:14px;word-break:break-word}
.info-item dd.mono{font-family:'JetBrains Mono','Courier New',monospace;font-size:13px}
.info-item.full{grid-column:1/-1}
.info-item dd a{font-weight:500}

/* ============= STATUS — vivid colors ============= */
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 14px;border-radius:999px;
  font-size:12px;font-weight:700;letter-spacing:.3px;
  width:max-content;color:#fff;
  text-transform:uppercase;
}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.85}
.status-pending  {background:var(--warn)}
.status-approved {background:var(--success)}
.status-rejected {background:var(--danger)}
.status-contacted{background:var(--info)}

/* Status action buttons */
.status-actions{display:flex;flex-direction:column;gap:8px}
.status-btn{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);background:var(--surface);
  font-weight:500;font-size:13.5px;text-align:left;
  transition:.15s;
  position:relative;
  font-family:inherit;
}
.status-btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--border-strong)}
.status-btn:disabled{opacity:.6;cursor:wait}
.status-btn .icon{
  width:26px;height:26px;flex:0 0 26px;
  display:grid;place-items:center;border-radius:50%;
  background:var(--surface-2);
  color:var(--ink-soft);
  transition:.15s;
}
.status-btn .icon svg{width:13px;height:13px}
.status-btn .label{flex:1}
.status-btn .spinner{
  display:none;
  width:14px;height:14px;
  border:2px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
.status-btn.is-loading{cursor:wait}
.status-btn.is-loading .spinner{display:inline-block}

/* Active state per status */
.status-btn[data-status="pending"].is-active   {background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.status-btn[data-status="pending"].is-active .icon  {background:var(--warn);color:#fff}
.status-btn[data-status="contacted"].is-active {background:var(--info-soft);border-color:var(--info);color:var(--info)}
.status-btn[data-status="contacted"].is-active .icon{background:var(--info);color:#fff}
.status-btn[data-status="approved"].is-active  {background:var(--success-soft);border-color:var(--success);color:var(--success)}
.status-btn[data-status="approved"].is-active .icon {background:var(--success);color:#fff}
.status-btn[data-status="rejected"].is-active  {background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.status-btn[data-status="rejected"].is-active .icon {background:var(--danger);color:#fff}

.status-btn.is-active{font-weight:700}

/* ============= NOTES ============= */
.notes-form{display:flex;flex-direction:column;gap:10px}
.notes-textarea{
  width:100%;
  min-height:90px;
  padding:11px 14px;
  border:1.5px solid var(--border-strong);
  border-radius:var(--radius-sm);
  background:var(--surface);
  font-size:14px;
  line-height:1.5;
  resize:vertical;
  font-family:inherit;
}
.notes-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}

.notes-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.notes-foot small{font-size:11.5px;color:var(--muted)}
.notes-foot kbd{
  font-family:'JetBrains Mono','Courier New',monospace;
  font-size:10.5px;
  padding:1px 5px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:3px;
}

.notes-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;max-height:400px;overflow-y:auto}
.note-item{
  padding:12px 14px;
  background:var(--surface-2);
  border-left:3px solid var(--accent);
  border-radius:var(--radius-sm);
}
.note-item__head{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-bottom:6px;
}
.note-item__author{font-weight:600;font-size:12.5px;color:var(--ink)}
.note-item__date{font-size:11px;color:var(--muted);white-space:nowrap}
.note-item__content{font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap;word-wrap:break-word}

.notes-empty{
  text-align:center;padding:24px 16px;color:var(--muted);
  font-size:13px;
}

/* ============= AUDIT LOG ============= */
.audit-list{display:flex;flex-direction:column}
.audit-item{
  display:flex;gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.audit-item:last-child{border-bottom:0}
.audit-icon{
  width:32px;height:32px;flex:0 0 32px;
  border-radius:50%;
  display:grid;place-items:center;
  background:var(--surface-2);
  color:var(--ink-soft);
}
.audit-icon svg{width:14px;height:14px}
.audit-icon--status_changed{background:var(--primary-50);color:var(--primary)}
.audit-icon--note_added{background:var(--accent-soft);color:var(--accent)}
.audit-icon--file_viewed{background:var(--info-soft);color:var(--info)}

.audit-body{flex:1;min-width:0}
.audit-body__line{font-size:13.5px;color:var(--ink);line-height:1.45}
.audit-body__line strong{font-weight:600}
.audit-body__meta{font-size:11.5px;color:var(--muted);margin-top:3px}

.audit-empty{text-align:center;padding:24px 16px;color:var(--muted);font-size:13px}

/* ============= FILES ============= */
.file-tabs{
  display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.file-tab{
  display:flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:var(--radius-sm);
  font-size:12.5px;font-weight:500;
  color:var(--ink-soft);
  white-space:nowrap;
  transition:.15s;
  border:1px solid transparent;
  font-family:inherit;
}
.file-tab:hover{background:var(--surface-2)}
.file-tab.is-active{background:var(--primary);color:#fff;border-color:var(--primary)}
.file-tab svg{width:12px;height:12px}

.file-viewer{
  height:600px;
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.file-viewer embed{width:100%;height:100%;border:0}
.file-viewer__empty{
  text-align:center;color:var(--muted);padding:40px;
}
.file-viewer__empty svg{width:48px;height:48px;color:var(--border-strong);margin-bottom:12px}
.file-viewer__empty h3{font-family:'Fraunces',serif;font-weight:500;margin:0 0 4px;color:var(--ink-soft)}
.file-viewer__actions{
  position:absolute;top:12px;right:12px;
  display:flex;gap:6px;
}
.file-viewer__btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:var(--radius-sm);
  background:rgba(12,26,43,.85);color:#fff;
  font-size:12px;font-weight:500;
  backdrop-filter:blur(8px);
}
.file-viewer__btn:hover{background:var(--ink);text-decoration:none}
.file-viewer__btn svg{width:12px;height:12px}

/* ============= TOAST ============= */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:200;
  background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:500;
  opacity:0;transform:translateY(20px);pointer-events:none;
  transition:.25s;
  max-width:340px;
  box-shadow:0 12px 32px -8px rgba(0,0,0,.3);
}
.toast.is-show{opacity:1;transform:translateY(0)}
.toast.is-success{background:var(--success)}
.toast.is-error{background:var(--danger)}

/* ============= LOADER ============= */
.loader{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{
  display:flex;align-items:center;justify-content:center;
  padding:60px 20px;color:var(--muted);gap:10px;
}

.error-screen{
  text-align:center;padding:60px 20px;
}
.error-screen h2{font-family:'Fraunces',serif;color:var(--danger);margin:0 0 10px}

/* ============= PRINT VIEW ============= */
.print-view{display:none}

@media print{
  .top-bar, .wrap{display:none !important}
  .print-view{
    display:block !important;
    padding:0;
    color:#000;
    font-size:11pt;
    line-height:1.45;
  }
  @page{margin:18mm 16mm}
  body{
    background:#fff;
    margin:0;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .print-view{font-family:'Manrope',sans-serif;color:#000}

  .pv-header{
    display:flex;align-items:flex-start;justify-content:space-between;
    border-bottom:2px solid #003b6f;
    padding-bottom:10px;margin-bottom:18px;
  }
  .pv-brand{display:flex;align-items:center;gap:10px}
  .pv-brand__mark{
    width:40px;height:40px;
    background:#003b6f;border-radius:50%;
    display:grid;place-items:center;color:#fff;
  }
  .pv-brand__mark svg{width:24px;height:24px}
  .pv-brand__text{display:flex;flex-direction:column}
  .pv-brand__name{font-family:'Fraunces',serif;font-weight:600;font-size:14pt;color:#003b6f}
  .pv-brand__sub{font-size:8pt;color:#444;letter-spacing:.4px;text-transform:uppercase}

  .pv-header__right{text-align:right}
  .pv-reg-no{font-family:'Fraunces',serif;font-weight:600;font-size:13pt;color:#003b6f}
  .pv-date{font-size:9pt;color:#444;margin-top:2px}

  .pv-title{
    font-family:'Fraunces',serif;font-weight:500;
    font-size:18pt;margin:0 0 18px;color:#003b6f;text-align:center;
  }

  .pv-section{margin-bottom:14pt;page-break-inside:avoid}
  .pv-section__title{
    font-family:'Fraunces',serif;font-weight:600;font-size:11pt;
    margin:0 0 6pt;color:#003b6f;
    padding-bottom:3pt;border-bottom:1px solid #b88746;
  }

  .pv-table{
    width:100%;border-collapse:collapse;font-size:10pt;
  }
  .pv-table tr{page-break-inside:avoid}
  .pv-table td{
    padding:5pt 8pt;border-bottom:1px solid #ddd;
    vertical-align:top;
  }
  .pv-table td:first-child{
    font-weight:600;color:#444;
    width:35%;
  }

  .pv-status{
    display:inline-block;padding:2pt 10pt;
    border-radius:3pt;font-weight:700;font-size:10pt;
    color:#fff;
  }
  .pv-status--approved {background:#0e7c4a}
  .pv-status--rejected {background:#b42318}
  .pv-status--pending  {background:#b54708}
  .pv-status--contacted{background:#0e639a}

  .pv-files{padding-left:14pt;margin:0}
  .pv-files li{margin-bottom:3pt;font-size:9.5pt}
  .pv-files a{color:#003b6f;text-decoration:underline;word-break:break-all}

  .pv-notes-print{
    background:#f9f6ef;border:1px solid #d3cdbf;
    border-radius:4pt;padding:8pt 10pt;
    font-size:10pt;
  }
  .pv-notes-print--empty{color:#888;font-style:italic}
  .pv-note-item{padding:6pt 0;border-bottom:1px dotted #d3cdbf}
  .pv-note-item:last-child{border-bottom:0}
  .pv-note-item__head{font-size:9pt;color:#444;margin-bottom:2pt;font-weight:600}
  .pv-note-item__content{font-size:10pt;white-space:pre-wrap}

  .pv-foot{
    margin-top:30pt;
    display:flex;justify-content:space-between;align-items:flex-end;
    page-break-inside:avoid;
  }
  .pv-sig{
    flex:1;max-width:45%;
    border-top:1px solid #444;padding-top:4pt;
    font-size:9pt;color:#444;text-align:center;
  }
  .pv-foot-meta{
    font-size:8pt;color:#777;text-align:right;
  }
}
</style>
</head>

<!-- ============= TOP BAR ============= -->
<div class="top-bar">
  <div class="top-bar__left">
    <a class="back-link" href="/admin.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Geri
    </a>
    <div class="top-title">
      <h1>Müraciət detalları</h1>
      <span class="reg-no" id="topRegNo">—</span>
    </div>
  </div>
  <div class="top-bar__right">
    <button class="btn" id="btnPrint" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Çap et
    </button>
  </div>
</div>

<!-- ============= MAIN VIEW ============= -->
<div class="wrap" id="mainView">
  <div class="loading-screen" id="loadingScreen" style="grid-column:1/-1">
    <span class="loader"></span> Yüklənir...
  </div>
</div>

<!-- ============= PRINT VIEW ============= -->
<div class="print-view" id="printView"></div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = '/api';

const params = new URLSearchParams(location.search);
const enrollmentId = parseInt(params.get('id'));

let currentData = null;
let currentNotes = [];
let currentAudit = [];

const STATUS_LABELS = {
  pending:   'Gözləyir',
  approved:  'Təsdiqlənib',
  rejected:  'Rədd edilib',
  contacted: 'Əlaqə saxlanılıb'
};

const FILE_LABELS = {
  id_file:          'Şəxsiyyət vəsiqəsi',
  diploma_file:     'Diplom',
  work_file:        'İşçi diplomu',
  medical_file:     'Tibbi kitabça',
  application_file: 'Ərizə',
  receipt_file:     'Ödəniş çeki'
};

const POSITION_LABELS = {
  captain: 'Kapitan',
  chief_officer: 'Baş köməkçi',
  officer: 'Növbə zabiti',
  chief_engineer: 'Baş mexanik',
  second_engineer: 'İkinci mexanik',
  engineer: 'Növbə mexaniki',
  electrical_officer: 'Elektrotexniki zabit',
  cadet: 'Kursant',
  other: 'Digər'
};

const WORKPLACE_LABELS = {
  asco: 'ASCO (Azərbaycan Xəzər Dəniz Gəmiçiliyi)',
  cms: 'Caspian Marine Services',
  cdc: 'Caspian Drilling Company',
  socar_marine: 'SOCAR Marine',
  bp_agt: 'BP-AGT',
  none: 'İşləmir',
  other: 'Digər'
};

/* ============= UTILITIES ============= */
function $(sel){return document.querySelector(sel)}
function $$(sel){return document.querySelectorAll(sel)}

function escapeHtml(s){
  if(s==null)return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDate(iso){
  if(!iso)return '—';
  const d=new Date(iso);
  if(isNaN(d))return iso;
  const pad=n=>String(n).padStart(2,'0');
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDateRelative(iso){
  if(!iso)return '—';
  const d=new Date(iso);
  if(isNaN(d))return iso;
  const diff=(Date.now()-d.getTime())/1000;
  if(diff<60)return 'indi';
  if(diff<3600)return `${Math.floor(diff/60)} dəq əvvəl`;
  if(diff<86400)return `${Math.floor(diff/3600)} saat əvvəl`;
  if(diff<604800)return `${Math.floor(diff/86400)} gün əvvəl`;
  return formatDate(iso);
}

function showToast(msg, type=''){
  const t=$('#toast');
  t.textContent=msg;
  t.className='toast is-show '+(type?'is-'+type:'');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('is-show'),2800);
}

function parseFiles(files){
  if(!files)return {};
  if(typeof files==='string'){try{return JSON.parse(files)}catch{return {}}}
  return files;
}

function workplaceText(d){
  if(d.workplace_id==='other' && d.workplace_other) return d.workplace_other;
  if(d.workplace_id) return WORKPLACE_LABELS[d.workplace_id] || d.workplace_id;
  return '—';
}

function positionText(d){
  if(!d.position) return '—';
  return POSITION_LABELS[d.position] || d.position;
}

function fileLabel(key){
  return FILE_LABELS[key] || key;
}

/* ============= API ============= */
async function apiGet(path){
  const r=await fetch(API_BASE+path,{credentials:'include'});
  if(r.status===401){location.href='/login.html';throw new Error('Unauthorized')}
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return await r.json();
}

async function apiPost(path, body){
  const r=await fetch(API_BASE+path,{
    method:'POST',credentials:'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})
  });
  if(r.status===401){location.href='/login.html';throw new Error('Unauthorized')}
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||`HTTP ${r.status}`)}
  return await r.json();
}

async function apiPatch(path, body){
  const r=await fetch(API_BASE+path,{
    method:'PATCH',credentials:'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(r.status===401){location.href='/login.html';throw new Error('Unauthorized')}
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||`HTTP ${r.status}`)}
  return await r.json();
}

/* ============= LOAD ============= */
async function loadEnrollment(){
  if(!enrollmentId){
    $('#mainView').innerHTML=`<div class="error-screen" style="grid-column:1/-1"><h2>ID tapılmadı</h2><p>URL-də müraciət ID-si göstərilməyib.</p><a class="btn btn-primary" href="/admin.html">Admin paneline qayıt</a></div>`;
    return;
  }

  try{
    const all=await apiGet('/students');
    const item=all.find(e=>e.id===enrollmentId);
    if(!item){
      $('#mainView').innerHTML=`<div class="error-screen" style="grid-column:1/-1"><h2>Müraciət tapılmadı</h2><p>#${enrollmentId} ID ilə qeydiyyat mövcud deyil.</p><a class="btn btn-primary" href="/admin.html">Admin paneline qayıt</a></div>`;
      return;
    }
    currentData=item;

    // Paralel olaraq notes və audit-i yüklə
    const [notes, audit] = await Promise.all([
      apiGet(`/enrollments/${enrollmentId}/notes`).catch(()=>[]),
      apiGet(`/enrollments/${enrollmentId}/audit`).catch(()=>[])
    ]);
    currentNotes = notes;
    currentAudit = audit;

    renderSkeleton();
    renderInfo();
    renderStatus();
    renderFiles();
    renderNotes();
    renderAudit();
    renderPrintView();
  }catch(err){
    $('#mainView').innerHTML=`<div class="error-screen" style="grid-column:1/-1"><h2>Xəta</h2><p>${escapeHtml(err.message)}</p></div>`;
  }
}

function statusIcon(s){
  const icons={
    pending: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    contacted: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',

    rejected: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
  };
  return icons[s]||'';
}

async function changeStatus(newStatus, clickedBtn){
  if(newStatus===currentData.status)return;

  const oldStatus = currentData.status;

  // Optimistik UI: bütün düymələri disable et, spinneri göstər
  const allBtns = document.querySelectorAll('#statusActions .status-btn');
  allBtns.forEach(b=>b.disabled=true);
  clickedBtn.classList.add('is-loading');

  try{
    await apiPatch(`/enrollments/${currentData.id}/status`,{status:newStatus});
    currentData.status=newStatus;

    // YALNIZ status pill və düymələri yenilə, qalan səhifə qalır
    allBtns.forEach(b=>{
      b.classList.toggle('is-active', b.dataset.status===newStatus);
      b.disabled=false;
      b.classList.remove('is-loading');
    });

    // Pill-i yenilə
    const pill = $('#statusPill');
    if(pill){
      pill.className = `status-pill status-${newStatus}`;
      pill.innerHTML = `<span class="dot"></span>${STATUS_LABELS[newStatus]}`;
    }

    // Audit log-u yenidən yüklə
    apiGet(`/enrollments/${currentData.id}/audit`).then(audit=>{
      currentAudit = audit;
      renderAudit();
      renderPrintView();
    }).catch(()=>{});

    showToast(`Status: ${STATUS_LABELS[oldStatus]} → ${STATUS_LABELS[newStatus]}`,'success');
  }catch(err){
    allBtns.forEach(b=>{b.disabled=false;b.classList.remove('is-loading')});
    showToast('Status yenilənmədi: '+err.message,'error');
  }
}

function renderNotes(){
  $('#cardNotes').innerHTML=`

        <p>Daxili — yalnız adminlər görür</p>
      </div>
    </div>
    <div class="card__body">
      <div class="notes-form">
        <textarea class="notes-textarea" id="notesArea" placeholder="Müraciət haqqında qeydinizi buraya yazın..."></textarea>
        <div class="notes-foot">
          <small><kbd>Ctrl</kbd>+<kbd>Enter</kbd> ilə əlavə et</small>
          <button class="btn btn-primary" id="btnAddNote" type="button" disabled>Əlavə et</button>
        </div>
      </div>
      <div class="notes-list" id="notesList"></div>
    </div>
  `;

  const textarea = $('#notesArea');
  const btn = $('#btnAddNote');

  textarea.addEventListener('input',()=>{
    btn.disabled = !textarea.value.trim();
  });
  textarea.addEventListener('keydown',e=>{
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){
      e.preventDefault();
      addNote();
    }
  });
  btn.addEventListener('click', addNote);

  renderNotesList();
}

function renderNotesList(){
  const list = $('#notesList');
  if(!list)return;
  if(currentNotes.length===0){
    list.innerHTML = '<div class="notes-empty">Hələ qeyd yoxdur</div>';
    return;
  }
  list.innerHTML = currentNotes.map(n=>`
    <div class="note-item">
      <div class="note-item__head">
        <span class="note-item__author">${escapeHtml(n.author_name||n.author_email)}</span>
        <span class="note-item__date" title="${escapeHtml(formatDate(n.created_at))}">${escapeHtml(formatDateRelative(n.created_at))}</span>
      </div>
      <div class="note-item__content">${escapeHtml(n.content)}</div>
    </div>
  `).join('');
}

async function addNote(){
  const textarea = $('#notesArea');
  const btn = $('#btnAddNote');
  const content = textarea.value.trim();
  if(!content)return;

  btn.disabled=true;
  btn.textContent='Əlavə edilir...';

  try{
    const newNote = await apiPost(`/enrollments/${currentData.id}/notes`,{content});
    currentNotes = [newNote, ...currentNotes];
    textarea.value='';
    renderNotesList();
    showToast('Qeyd əlavə edildi','success');

    // Audit log-u yenidən yüklə
    apiGet(`/enrollments/${currentData.id}/audit`).then(audit=>{
      currentAudit = audit;
      renderAudit();
      renderPrintView();
    }).catch(()=>{});
  }catch(err){
    showToast('Qeyd əlavə edilmədi: '+err.message,'error');
  }finally{
    btn.disabled=false;
    btn.textContent='Əlavə et';
  }
}

function auditItemHtml(a){
  const auditIcons={
    status_changed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
    note_added: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    file_viewed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
  };

  let line='';
  const author = escapeHtml(a.admin_name||a.admin_email);
  if(a.action==='status_changed'){
    const from = STATUS_LABELS[a.details.from] || a.details.from || '—';
    const to = STATUS_LABELS[a.details.to] || a.details.to || '—';
    line = `<strong>${author}</strong> statusu dəyişdi: <strong>${escapeHtml(from)}</strong> → <strong>${escapeHtml(to)}</strong>`;
  }else if(a.action==='note_added'){
    const preview = a.details.preview || '';
    line = `<strong>${author}</strong> qeyd əlavə etdi${preview ? `: <em style="color:var(--muted)">"${escapeHtml(preview.slice(0,80))}${preview.length>80?'…':''}"</em>` : ''}`;
  }else if(a.action==='file_viewed'){
    line = `<strong>${author}</strong> sənədə baxdı: <strong>${escapeHtml(fileLabel(a.details.file))}</strong>`;
  }else{
    line = `<strong>${author}</strong> hərəkət: ${escapeHtml(a.action)}`;
  }

  return `
    <div class="audit-item">
      <div class="audit-icon audit-icon--${escapeHtml(a.action)}">${auditIcons[a.action]||''}</div>
      <div class="audit-body">
        <div class="audit-body__line">${line}</div>
        <div class="audit-body__meta">${escapeHtml(formatDate(a.created_at))} · ${escapeHtml(a.admin_email)}</div>
      </div>
    </div>
  `;
}

/* Track file views (fire-and-forget) */
const viewedFiles = new Set();
function logFileView(fileKey){
  // Eyni faylı bir səssiyyada bir dəfə log et
  const sessionKey = `${currentData.id}_${fileKey}`;
  if(viewedFiles.has(sessionKey))return;
  viewedFiles.add(sessionKey);

  apiPost(`/enrollments/${currentData.id}/file-view`,{file_key:fileKey})
    .then(()=>{
      // 2 saniyə sonra audit-i yenilə (UI spam-ı olmasın)
      clearTimeout(window._auditRefresh);
      window._auditRefresh = setTimeout(()=>{
        apiGet(`/enrollments/${currentData.id}/audit`).then(audit=>{
          currentAudit = audit;
          renderAudit();
        }).catch(()=>{});
      }, 2000);
    })
    .catch(()=>{});
}
